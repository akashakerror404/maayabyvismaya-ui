<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — Maaya by Vismaya</title>
  <link rel="icon" href="assets/img/brand/motif-brown.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo:ital,wght@0,300;0,400;0,500;0,600;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="auth">

  <main class="auth">
    <div class="auth__visual">
      <img src="assets/img/products/earrings-05-2.jpg" alt="">
      <img class="auth__seal" src="assets/img/brand/logo-seal-white.svg" alt="">
      <div class="auth__quote"><span class="script">a piece of you</span><p>Beauty isn't rationed. It belongs to every age, every face, every life.</p></div>
    </div>
    <div class="auth__panel">
      <div class="auth__top"><a href="index.html"><img src="assets/img/brand/wordmark-brown.svg" alt="Maaya by Vismaya"></a><a href="index.html" class="back"><span data-icon="back"></span>Back to store</a></div>
      
      <form class="auth__form" onsubmit="event.preventDefault();location.href='orders.html'">
        <span class="script" style="font-size:40px">join the circle</span>
        <h1>Create account</h1>
        <p>Get 10% off your first order and early access to new drops.</p>
        <button type="button" class="btn-google" data-google onclick="location.href='orders.html'">Sign up with Google</button>
        <div class="or">or use your email</div>
        <div class="form-grid">
          <div class="field"><label>First name</label><input class="input" placeholder="Ananya" required></div>
          <div class="field"><label>Last name</label><input class="input" placeholder="Menon"></div>
          <div class="field full"><label>Email</label><input class="input" type="email" placeholder="you@example.com" required></div>
          <div class="field full"><label>Mobile number</label><div class="input-prefix"><span>+91</span><input class="input" inputmode="tel" placeholder="98470 12345" required></div></div>
          <div class="field full"><label>Password</label><div class="input-group"><input class="input" type="password" placeholder="At least 8 characters" required><button type="button" data-icon="eye" aria-label="Show password" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'"></button></div>
            <div class="pw-meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div><span class="hint">Good — add a symbol to make it strong</span></div>
        </div>
        <label class="check" style="font-size:13px;margin:18px 0 8px"><input type="checkbox" checked> Send me new drops &amp; offers on WhatsApp</label>
        <label class="check" style="font-size:13px;margin-bottom:24px"><input type="checkbox" required> <span>I agree to the <a href="#" class="text-link">Terms</a> &amp; <a href="#" class="text-link">Privacy policy</a></span></label>
        <button class="btn btn--block">Create account</button>
        <p class="auth__switch">Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </div>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
