<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Maaya by Vismaya</title>
  <link rel="icon" href="assets/img/brand/motif-brown.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo:ital,wght@0,300;0,400;0,500;0,600;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="auth">

  <main class="auth">
    <div class="auth__visual">
      <img src="assets/img/products/necklace-02-2.jpg" alt="">
      <img class="auth__seal" src="assets/img/brand/logo-seal-white.svg" alt="">
      <div class="auth__quote"><span class="script">a piece of you</span><p>Built to stay. Made to be noticed by you first.</p></div>
    </div>
    <div class="auth__panel">
      <div class="auth__top"><a href="index.html"><img src="assets/img/brand/wordmark-brown.svg" alt="Maaya by Vismaya"></a><a href="index.html" class="back"><span data-icon="back"></span>Back to store</a></div>
      
      <form class="auth__form" onsubmit="event.preventDefault();location.href='orders.html'">
        <span class="script" style="font-size:40px">welcome back</span>
        <h1>Sign in</h1>
        <p>Track orders, save your wishlist and check out faster.</p>
        <button type="button" class="btn-google" data-google onclick="location.href='orders.html'">Continue with Google</button>
        <div class="or">or sign in with email</div>
        <div class="field"><label>Email or mobile number</label><input class="input" type="text" placeholder="you@example.com" required></div>
        <div class="field"><label>Password</label><div class="input-group"><input class="input" type="password" placeholder="••••••••" required><button type="button" data-icon="eye" aria-label="Show password" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'"></button></div></div>
        <div class="auth__row"><label class="check" style="font-size:13px"><input type="checkbox" checked> Keep me signed in</label><a href="#" class="text-link">Forgot password?</a></div>
        <button class="btn btn--block">Sign in</button>
        <p class="auth__switch">New to Maaya? <a href="signup.html">Create an account</a></p>
      </form>
    </div>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
