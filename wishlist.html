<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — Maaya by Vismaya</title>
  <link rel="icon" href="assets/img/brand/motif-brown.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo:ital,wght@0,300;0,400;0,500;0,600;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="wishlist">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-title"><span class="script">saved for later</span><h1 class="display-l">Your wishlist</h1><p id="wish-count"></p></div>
    <div id="wish-grid" class="grid grid--4"></div>
    <div style="margin:44px 0 0;padding:28px;background:var(--sand);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
      <div><span class="script" style="font-size:34px">drop a hint</span><p class="muted" style="font-size:14px">Share your wishlist with someone who loves gifting you.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn--ghost btn--sm" data-icon="wa"> WhatsApp</button><button class="btn btn--sm">Copy link</button></div>
    </div>
    <section class="section">
      <div class="section-head"><div><span class="script">you might like</span><h2 class="display-m">Picked for you</h2></div></div>
      <div class="grid grid--4" data-products="bestsellers" data-limit="4"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
